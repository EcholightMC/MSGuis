plugins {
    id "java"
    id "maven-publish"
}

group = "com.github.echolightmc"
version = "1.5-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
}

dependencies {
    compileOnly("net.minestom:minestom:2026.01.08-1.21.11")
    testImplementation("net.minestom:minestom:2026.01.08-1.21.11")
    implementation("net.kyori:adventure-text-minimessage:4.26.1")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = rootProject.name
            version = this.version
            from components.java

            pom {
                name = artifactId
                description = "Easy GUI library made for Minestom"
            }
        }
    }
    repositories {
        maven {
            credentials {
                username = "$repoHapilyUsername"
                password = "$repoHapilyPassword"
            }

            url = "https://maven.hapily.me/releases"
        }
    }
}